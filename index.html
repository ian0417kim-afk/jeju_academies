<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 학원 — Jeju Academy Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1c1a;--stone:#f0f4f8;--sand:#dde6ef;
  --blue:#1a5fa8;--navy:#0d3b6e;--sky:#3a8fd4;
  --muted:#7a8a9a;--white:#fdfcfa;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--stone);color:var(--ink);font-family:'Noto Sans KR',sans-serif;}

.site-header{position:sticky;top:0;z-index:100;background:rgba(240,244,248,0.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--sand);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--ink);text-decoration:none;}
.logo span{color:var(--blue);font-style:italic;}

.hero{padding:36px 20px 28px;text-align:center;background:linear-gradient(160deg,var(--white) 0%,var(--stone) 100%);}
.hero-eyebrow{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--blue);margin-bottom:10px;}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,6vw,44px);line-height:1.2;margin-bottom:10px;}
.hero-title em{color:var(--blue);font-style:italic;}
.hero-sub{font-size:13px;color:var(--muted);line-height:1.8;}

.loading{text-align:center;padding:60px 20px;color:var(--muted);}
.loading-spinner{width:36px;height:36px;border:3px solid var(--sand);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

.search-panel{background:var(--white);margin:20px;border-radius:20px;padding:24px;border:1px solid var(--sand);box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.panel-section{margin-bottom:20px;}
.panel-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.search-input{width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--sand);background:var(--stone);font-family:'Noto Sans KR',sans-serif;font-size:14px;outline:none;color:var(--ink);margin-bottom:0;}
.search-input:focus{border-color:var(--blue);}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:8px 15px;border-radius:100px;border:1.5px solid var(--sand);background:var(--stone);font-size:12px;color:var(--ink);cursor:pointer;transition:all 0.2s;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;}
.chip:hover{border-color:var(--blue);color:var(--blue);}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--white);}
.search-btn{width:100%;padding:14px;background:var(--blue);color:var(--white);border:none;border-radius:14px;font-size:15px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all 0.2s;margin-top:4px;}
.search-btn:hover{background:var(--navy);box-shadow:0 6px 20px rgba(26,95,168,0.3);}
.search-btn:active{transform:scale(0.98);}

.result-bar{display:none;align-items:center;justify-content:space-between;padding:8px 20px 14px;}
.result-title{font-family:'Cormorant Garamond',serif;font-size:20px;}
.result-count{font-size:12px;color:var(--muted);background:var(--sand);padding:4px 12px;border-radius:20px;}

.academy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:0 20px 110px;}
.academy-card{background:var(--white);border-radius:16px;overflow:hidden;border:1px solid var(--sand);cursor:pointer;transition:all 0.22s;}
.academy-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,0.09);border-color:transparent;}
.card-top{padding:18px 18px 12px;}
.card-tags{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.card-badge{font-size:10px;padding:3px 9px;border-radius:100px;font-weight:600;}
.badge-국제{background:#e8f0fb;color:#1a5fa8;}
.badge-영어{background:#e8fbf0;color:#1aa85f;}
.badge-수학{background:#fce8e8;color:#a81a1a;}
.badge-과학{background:#e8f8fb;color:#1a8aa8;}
.badge-국어{background:#f0e8fb;color:#5f1aa8;}
.badge-예능{background:#fdf0e8;color:#a85f1a;}
.badge-area{background:var(--stone);color:var(--muted);border:1px solid var(--sand);}
.card-name{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:5px;}
.card-course{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:10px;}
.card-bottom{padding:10px 18px;border-top:1px solid var(--stone);display:flex;align-items:center;justify-content:space-between;}
.card-addr{font-size:11px;color:var(--muted);flex:1;margin-right:8px;line-height:1.4;}
.card-tel{font-size:11px;color:var(--blue);white-space:nowrap;font-weight:500;}
.empty{text-align:center;padding:64px 24px;color:var(--muted);grid-column:1/-1;}

/* 상세 오버레이 */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:300;background:var(--white);transform:translateX(100%);transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;}
.overlay.open{transform:translateX(0);}
.overlay-nav{position:sticky;top:0;z-index:10;background:rgba(253,252,250,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--sand);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.back-btn{background:none;border:none;cursor:pointer;font-size:14px;color:var(--ink);font-family:'Noto Sans KR',sans-serif;}
.d-header{padding:28px 20px 22px;background:linear-gradient(135deg,var(--navy),var(--blue));}
.d-tags{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.d-tag{font-size:10px;padding:3px 10px;border-radius:100px;background:rgba(255,255,255,0.2);color:white;font-weight:600;}
.d-name{font-family:'Cormorant Garamond',serif;font-size:28px;color:white;line-height:1.25;margin-bottom:4px;}
.d-gubun{font-size:11px;color:rgba(255,255,255,0.65);}
.d-body{padding:22px 20px 40px;max-width:680px;}
.info-row{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start;}
.info-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
.info-text{font-size:13px;color:var(--ink);line-height:1.65;}
.info-text a{color:var(--blue);text-decoration:none;}
.d-section-label{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;font-weight:600;}
.course-box{background:var(--stone);border-radius:12px;padding:14px;font-size:12px;color:var(--ink);line-height:1.9;}
.contact-btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px;}
.c-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:100px;font-size:13px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-decoration:none;border:none;transition:all 0.2s;}
.c-btn-call{background:var(--blue);color:white;}
.c-btn-call:hover{background:var(--navy);}
.c-btn-naver{background:#03C75A;color:white;}
.c-btn-naver:hover{background:#02a84a;}
.c-btn-kakao{background:#FEE500;color:#391B1B;}
.c-btn-kakao:hover{background:#f0d800;}
.c-btn-msg{background:var(--ink);color:white;}
.c-btn-msg:hover{background:#333;}
.msg-form{display:none;margin-top:14px;background:var(--stone);border-radius:14px;padding:16px;}
.msg-form input,.msg-form textarea{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--sand);background:var(--white);font-family:'Noto Sans KR',sans-serif;font-size:13px;margin-bottom:8px;outline:none;}
.msg-form textarea{resize:none;}
.msg-send-btn{width:100%;padding:12px;background:var(--blue);color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.divider{height:1px;background:var(--sand);margin:18px 0;}
.d-map{width:100%;height:260px;border-radius:14px;border:none;box-shadow:0 4px 16px rgba(0,0,0,0.08);display:block;}
.map-ext{display:block;text-align:center;margin-top:10px;font-size:12px;color:var(--blue);text-decoration:none;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(253,252,250,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--sand);display:flex;justify-content:space-around;padding:10px 0 16px;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;font-size:11px;color:var(--muted);font-family:'Noto Sans KR',sans-serif;}
.nav-btn.active{color:var(--blue);}
.nav-icon{font-size:20px;}

@media(max-width:600px){
  .academy-grid{grid-template-columns:1fr;gap:10px;padding:0 14px 110px;}
  .search-panel{margin:14px;padding:18px;}
}
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">Jeju <span>Academy</span></a>
  <span style="font-size:11px;color:var(--muted);">제주시 학원 안내</span>
</header>

<section class="hero">
  <div class="hero-eyebrow">Jeju Academy Guide</div>
  <h1 class="hero-title"><em>제주시 학원</em>을 찾아드립니다</h1>
  <p class="hero-sub" id="h-sub">제주시 학원·교습소 정보 제공</p>
</section>

<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <p>데이터 불러오는 중...</p>
</div>

<div id="main-content" style="display:none;">
<div class="search-panel">
  <div class="panel-section">
    <div class="panel-label">학원명 검색</div>
    <input class="search-input" id="kw-input" type="text" placeholder="학원명 입력..." onkeydown="if(event.key==='Enter')doSearch()">
  </div>
  <div class="panel-section">
    <div class="panel-label">지 역</div>
    <div class="chips" id="area-chips">
      <button class="chip on" data-v="all" onclick="pickChip(this,'area')">전체</button>
      <button class="chip" data-v="노형동" onclick="pickChip(this,'area')">노형동</button>
      <button class="chip" data-v="연동·이도동" onclick="pickChip(this,'area')">연동·이도동</button>
      <button class="chip" data-v="아라동" onclick="pickChip(this,'area')">아라동</button>
      <button class="chip" data-v="외도동" onclick="pickChip(this,'area')">외도동</button>
      <button class="chip" data-v="화북" onclick="pickChip(this,'area')">화북</button>
      <button class="chip" data-v="기타(읍면)" onclick="pickChip(this,'area')">기타(읍면)</button>
    </div>
  </div>
  <div class="panel-section">
    <div class="panel-label">과 목</div>
    <div class="chips" id="subj-chips">
      <button class="chip on" data-v="all" onclick="pickChip(this,'subj')">전체</button>
      <button class="chip" data-v="국제학교·관리형" onclick="pickChip(this,'subj')">🌏 국제학교·관리형</button>
      <button class="chip" data-v="영어" onclick="pickChip(this,'subj')">🗣 영어</button>
      <button class="chip" data-v="수학" onclick="pickChip(this,'subj')">📐 수학</button>
      <button class="chip" data-v="과학" onclick="pickChip(this,'subj')">🔬 과학</button>
      <button class="chip" data-v="국어" onclick="pickChip(this,'subj')">📝 국어</button>
      <button class="chip" data-v="예능·기타" onclick="pickChip(this,'subj')">🎨 예능·기타</button>
    </div>
  </div>
  <button class="search-btn" onclick="doSearch()">🔍 학원 찾기</button>
</div>

<div class="result-bar" id="result-bar">
  <div class="result-title" id="result-title"></div>
  <div class="result-count" id="result-count"></div>
</div>
<div class="academy-grid" id="academy-grid"></div>
</div>

<!-- 상세 오버레이 -->
<div class="overlay" id="overlay">
  <div class="overlay-nav">
    <button class="back-btn" onclick="closeDetail()">← 목록으로</button>
    <span style="font-size:10px;color:var(--muted);letter-spacing:0.12em;">JEJU ACADEMY</span>
  </div>
  <div class="d-header">
    <div class="d-tags" id="d-tags"></div>
    <div class="d-name" id="d-name"></div>
    <div class="d-gubun" id="d-gubun"></div>
  </div>
  <div class="d-body">
    <div class="info-row"><span class="info-icon">📍</span><span class="info-text" id="d-addr"></span></div>
    <div class="info-row" id="d-tel-row"><span class="info-icon">📞</span><span class="info-text"><a id="d-tel" href="#"></a></span></div>
    <div id="d-course-wrap">
      <div class="d-section-label">교습과정</div>
      <div class="course-box" id="d-course"></div>
    </div>
    <div class="contact-btns">
      <a class="c-btn c-btn-call" id="btn-call" href="#">📞 전화</a>
      <a class="c-btn c-btn-naver" id="btn-naver" href="#" target="_blank">🔍 네이버 지도</a>
      <a class="c-btn c-btn-kakao" id="btn-kakao" href="#" target="_blank">💬 카카오맵</a>
      <button class="c-btn c-btn-msg" onclick="toggleMsgForm()">✉️ 문의하기</button>
    </div>
    <div class="msg-form" id="msg-form">
      <div style="font-size:13px;font-weight:600;margin-bottom:12px;">수강 문의</div>
      <input id="f-name" type="text" placeholder="이름">
      <input id="f-phone" type="tel" placeholder="연락처">
      <textarea id="f-msg" rows="3" placeholder="문의 내용 (희망 과목, 학년 등)"></textarea>
      <button class="msg-send-btn" onclick="sendMsg()">보내기</button>
      <div id="msg-sent" style="display:none;text-align:center;padding:12px;color:var(--blue);font-size:13px;margin-top:8px;">✅ 문의가 접수되었습니다!</div>
    </div>
    <div class="divider"></div>
    <div class="d-section-label">📍 위치</div>
    <iframe class="d-map" id="d-map" allowfullscreen loading="lazy" title="map"></iframe>
    <a class="map-ext" id="d-map-ext" href="#" target="_blank">🗺 구글맵에서 크게 보기</a>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn" onclick="location.href='index.html'"><span class="nav-icon">🏠</span><span>숙소</span></button>
  <button class="nav-btn" onclick="location.href='jeju-food.html'"><span class="nav-icon">🍽</span><span>맛집</span></button>
  <button class="nav-btn active"><span class="nav-icon">📚</span><span>학원</span></button>
  <button class="nav-btn"><span class="nav-icon">♡</span><span>저장</span></button>
</nav>

<script>
var SHEET_ID = '19JB-ZUfdZKpBRVcQzfAlzdXXtWOlGUF94Az2SFQ7i6k';
var SHEET_URL = 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&sheet=Sheet1';

var SUBJ_BADGE = {
  '국제학교·관리형':'badge-국제','영어':'badge-영어','수학':'badge-수학',
  '과학':'badge-과학','국어':'badge-국어','예능·기타':'badge-예능'
};
var SUBJ_ICON = {
  '국제학교·관리형':'🌏','영어':'🗣','수학':'📐',
  '과학':'🔬','국어':'📝','예능·기타':'🎨'
};

var academies = [];
var filtered  = [];
var selArea   = 'all';
var selSubj   = 'all';

function parseCSVLine(line){
  var res=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){res.push(cur);cur='';}
    else{cur+=c;}
  }
  res.push(cur);
  return res;
}
function parseCSV(text){
  var lines=text.trim().split('\n');
  var headers=parseCSVLine(lines[0]).map(function(h){return h.trim().replace(/^"|"$/g,'');});
  var result=[];
  for(var i=1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    var vals=parseCSVLine(lines[i]);
    var obj={};
    for(var j=0;j<headers.length;j++) obj[headers[j]]=(vals[j]||'').trim().replace(/^"|"$/g,'');
    result.push(obj);
  }
  return result;
}

function loadData(){
  fetch(SHEET_URL)
    .then(function(r){if(!r.ok)throw new Error('fail');return r.text();})
    .then(function(text){
      var rows=parseCSV(text);
      academies=[];
      for(var i=0;i<rows.length;i++){
        var r=rows[i];
        if(r['노출여부']&&r['노출여부'].toUpperCase()==='N') continue;
        academies.push({
          id:   parseInt(r['id'])||(i+1),
          name: r['학원명']||'',
          gubun:r['구분']||'',
          area: r['지역']||'기타',
          subj: r['과목']||'예능·기타',
          course:r['교습과정']||'',
          addr: r['주소']||'',
          tel:  r['전화']||''
        });
      }
      document.getElementById('loading').style.display='none';
      document.getElementById('main-content').style.display='block';
      document.getElementById('h-sub').textContent='제주시 학원·교습소 '+academies.length+'곳 정보 제공';
    })
    .catch(function(e){
      document.getElementById('loading').innerHTML='<p style="color:#c00">데이터 로드 실패. 잠시 후 다시 시도해주세요.</p>';
    });
}

function pickChip(el,type){
  var gid=type==='area'?'area-chips':'subj-chips';
  document.querySelectorAll('#'+gid+' .chip').forEach(function(c){c.classList.remove('on');});
  el.classList.add('on');
  if(type==='area') selArea=el.getAttribute('data-v');
  else selSubj=el.getAttribute('data-v');
}

function doSearch(){
  var kw=document.getElementById('kw-input').value.trim().toLowerCase();
  filtered=academies;
  if(selArea!=='all') filtered=filtered.filter(function(a){return a.area===selArea;});
  if(selSubj!=='all') filtered=filtered.filter(function(a){return a.subj===selSubj;});
  if(kw) filtered=filtered.filter(function(a){
    return a.name.toLowerCase().includes(kw)||a.course.toLowerCase().includes(kw);
  });
  var bar=document.getElementById('result-bar');
  bar.style.display='flex';
  var label=[selArea==='all'?'':selArea, selSubj==='all'?'':selSubj].filter(Boolean).join(' ') || '전체';
  document.getElementById('result-title').textContent=label+(kw?' "'+kw+'"':'');
  document.getElementById('result-count').textContent=filtered.length+'개';
  renderCards();
  bar.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderCards(){
  var grid=document.getElementById('academy-grid');
  grid.innerHTML='';
  if(!filtered.length){
    var el=document.createElement('div');
    el.className='empty';
    el.innerHTML='<div style="font-size:48px;margin-bottom:12px">📚</div><p>해당 조건의 학원이 없어요</p>';
    grid.appendChild(el);
    return;
  }
  filtered.forEach(function(a){
    var card=document.createElement('div');
    card.className='academy-card';
    card.onclick=function(){openDetail(a.id);};
    var subjIcon=SUBJ_ICON[a.subj]||'📌';
    var subjBadge=SUBJ_BADGE[a.subj]||'badge-예능';
    card.innerHTML=
      '<div class="card-top">'
      +'<div class="card-tags">'
      +'<span class="card-badge '+subjBadge+'">'+subjIcon+' '+a.subj+'</span>'
      +'<span class="card-badge badge-area">📍'+a.area+'</span>'
      +'</div>'
      +'<div class="card-name">'+a.name+'</div>'
      +(a.course?'<div class="card-course">'+a.course+'</div>':'')
      +'</div>'
      +'<div class="card-bottom">'
      +'<div class="card-addr">'+a.addr+'</div>'
      +(a.tel?'<div class="card-tel">'+a.tel+'</div>':'')
      +'</div>';
    grid.appendChild(card);
  });
}

function openDetail(id){
  var a=academies.find(function(x){return x.id===id;});
  var subjIcon=SUBJ_ICON[a.subj]||'📌';
  var tags=document.getElementById('d-tags');
  tags.innerHTML='<span class="d-tag">'+subjIcon+' '+a.subj+'</span><span class="d-tag">📍'+a.area+'</span><span class="d-tag">'+a.gubun+'</span>';
  document.getElementById('d-name').textContent=a.name;
  document.getElementById('d-gubun').textContent=a.gubun;
  document.getElementById('d-addr').textContent=a.addr;
  // 전화
  var telRow=document.getElementById('d-tel-row');
  var telEl=document.getElementById('d-tel');
  if(a.tel){telEl.textContent=a.tel;telEl.href='tel:'+a.tel;telRow.style.display='flex';}
  else telRow.style.display='none';
  // 교습과정
  var cWrap=document.getElementById('d-course-wrap');
  if(a.course){document.getElementById('d-course').textContent=a.course;cWrap.style.display='block';}
  else cWrap.style.display='none';
  // 버튼
  document.getElementById('btn-call').href=a.tel?'tel:'+a.tel:'#';
  document.getElementById('btn-call').style.display=a.tel?'inline-flex':'none';
  document.getElementById('btn-naver').href='https://map.naver.com/v5/search/'+encodeURIComponent(a.name+' '+a.addr);
  document.getElementById('btn-kakao').href='https://map.kakao.com/?q='+encodeURIComponent(a.name+' '+a.addr);
  // 지도
  var mapQ=encodeURIComponent(a.addr);
  document.getElementById('d-map').src='https://maps.google.com/maps?q='+mapQ+'&z=16&output=embed&hl=ko';
  document.getElementById('d-map-ext').href='https://maps.google.com/maps?q='+mapQ+'&z=16';
  // 폼 리셋
  document.getElementById('msg-form').style.display='none';
  document.getElementById('msg-sent').style.display='none';
  document.getElementById('f-name').value='';
  document.getElementById('f-phone').value='';
  document.getElementById('f-msg').value='';
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeDetail(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
  document.getElementById('d-map').src='';
}
function toggleMsgForm(){
  var f=document.getElementById('msg-form');
  f.style.display=f.style.display==='none'?'block':'none';
}
function sendMsg(){
  var name=document.getElementById('f-name').value;
  var msg=document.getElementById('f-msg').value;
  if(!name||!msg){alert('이름과 문의 내용을 입력해주세요.');return;}
  document.getElementById('msg-sent').style.display='block';
  document.getElementById('f-name').value='';
  document.getElementById('f-phone').value='';
  document.getElementById('f-msg').value='';
  setTimeout(function(){
    document.getElementById('msg-sent').style.display='none';
    document.getElementById('msg-form').style.display='none';
  },3000);
}

loadData();
</script>
</body>
</html>
